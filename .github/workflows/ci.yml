name: tests (ubuntu + windows matrix)
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install (core stdlib; evaluator deps optional)
        run: |
          python -m pip install --upgrade pip
          pip install func-timeout>=4.3.5 pytest>=8
      - name: unit suite (sqlglot optional -> skips)
        run: python -m pytest tests -q
      - name: MANIFEST byte check (EOL freeze via .gitattributes)
        run: python -c "import hashlib,os,sys; ok=True
          for line in open('data/MANIFEST.sha256',encoding='utf-8'):
              want,_,name=line.partition('  '); p=os.path.join('data',name.strip())
              if not os.path.exists(p): continue
              got=hashlib.sha256(open(p,'rb').read()).hexdigest()
              if not got.startswith(want.split()[0][:12]): print('MISMATCH',name,got[:12]); ok=False
          sys.exit(0 if ok else 1)"
